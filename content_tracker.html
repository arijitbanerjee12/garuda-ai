<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Security Content & Brand Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-8">
    <div class="max-w-6xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold mb-2 text-teal-700">AI Security Content & Brand Tracker</h1>
        <p class="text-slate-600 mb-6">Track your YouTube videos, LinkedIn posts, and Open Source GitHub contributions. Data is saved locally in your browser.</p>

        <div class="flex gap-4 mb-6">
            <input type="text" id="new-item-title" placeholder="New idea (e.g., 'Video: Hacking RAG Pipelines')" class="flex-1 border p-2 rounded focus:outline-none focus:ring-2 focus:ring-teal-500">
            <select id="new-item-type" class="border p-2 rounded">
                <option value="youtube">🎬 YouTube / Shorts</option>
                <option value="linkedin">💼 LinkedIn Post</option>
                <option value="github">💻 GitHub Repo</option>
            </select>
            <button onclick="addItem()" class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700 font-semibold">+ Add Idea</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- IDEAS -->
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 shadow-sm min-h-[300px]" id="col-ideas">
                <h2 class="text-lg font-bold text-slate-700 mb-4 border-b pb-2 flex justify-between">
                    💡 Ideas <span class="bg-slate-200 text-sm px-2 py-0.5 rounded-full" id="count-ideas">0</span>
                </h2>
                <div id="list-ideas" class="space-y-3"></div>
            </div>

            <!-- IN PROGRESS -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 shadow-sm min-h-[300px]" id="col-progress">
                <h2 class="text-lg font-bold text-blue-700 mb-4 border-b pb-2 border-blue-200 flex justify-between">
                    🛠️ In Progress <span class="bg-blue-200 text-sm px-2 py-0.5 rounded-full" id="count-progress">0</span>
                </h2>
                <div id="list-progress" class="space-y-3"></div>
            </div>

            <!-- PUBLISHED -->
            <div class="bg-green-50 p-4 rounded-lg border border-green-100 shadow-sm min-h-[300px]" id="col-published">
                <h2 class="text-lg font-bold text-green-700 mb-4 border-b pb-2 border-green-200 flex justify-between">
                    ✅ Published <span class="bg-green-200 text-sm px-2 py-0.5 rounded-full" id="count-published">0</span>
                </h2>
                <div id="list-published" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        // Initial setup or load from localStorage
        let items = JSON.parse(localStorage.getItem('contentTrackerData')) || [
            { id: 1, title: "The Inception Attack (Prompt Injection in RAG)", type: "youtube", status: "ideas" },
            { id: 2, title: "How to use DeepEval for RAG", type: "linkedin", status: "ideas" },
            { id: 3, title: "Open Source LLM-as-a-Judge framework", type: "github", status: "progress" }
        ];

        function getIcon(type) {
            if(type === 'youtube') return '🎬';
            if(type === 'linkedin') return '💼';
            return '💻';
        }

        function getColor(type) {
            if(type === 'youtube') return 'text-red-600 bg-red-100';
            if(type === 'linkedin') return 'text-blue-600 bg-blue-100';
            return 'text-slate-700 bg-slate-200';
        }

        function render() {
            document.getElementById('list-ideas').innerHTML = '';
            document.getElementById('list-progress').innerHTML = '';
            document.getElementById('list-published').innerHTML = '';

            let counts = { ideas: 0, progress: 0, published: 0 };

            items.forEach(item => {
                counts[item.status]++;
                const el = document.createElement('div');
                el.className = "bg-white p-3 rounded shadow-sm border border-slate-200 flex flex-col";
                
                el.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold px-2 py-1 rounded uppercase ${getColor(item.type)}">${getIcon(item.type)} ${item.type}</span>
                        <button onclick="deleteItem(${item.id})" class="text-red-400 hover:text-red-600 font-bold">&times;</button>
                    </div>
                    <p class="font-medium text-slate-800 text-sm mb-3">${item.title}</p>
                    <select onchange="updateStatus(${item.id}, this.value)" class="text-xs border p-1 rounded bg-slate-50 w-full cursor-pointer">
                        <option value="ideas" ${item.status === 'ideas' ? 'selected' : ''}>💡 Ideas</option>
                        <option value="progress" ${item.status === 'progress' ? 'selected' : ''}>🛠️ In Progress</option>
                        <option value="published" ${item.status === 'published' ? 'selected' : ''}>✅ Published</option>
                    </select>
                `;
                
                document.getElementById(`list-${item.status}`).appendChild(el);
            });

            document.getElementById('count-ideas').innerText = counts.ideas;
            document.getElementById('count-progress').innerText = counts.progress;
            document.getElementById('count-published').innerText = counts.published;

            localStorage.setItem('contentTrackerData', JSON.stringify(items));
        }

        function addItem() {
            const titleInput = document.getElementById('new-item-title');
            const typeInput = document.getElementById('new-item-type');
            
            if(!titleInput.value.trim()) return alert("Please enter a title!");

            items.push({
                id: Date.now(),
                title: titleInput.value.trim(),
                type: typeInput.value,
                status: "ideas"
            });

            titleInput.value = '';
            render();
        }

        function deleteItem(id) {
            if(confirm("Delete this item?")) {
                items = items.filter(i => i.id !== id);
                render();
            }
        }

        function updateStatus(id, newStatus) {
            const item = items.find(i => i.id === id);
            if(item) {
                item.status = newStatus;
                render();
            }
        }

        render();
    </script>
</body>
</html>
